name: alarma_esp32_antizombi
description: "Alarma ESP32 Antizombi - Aplicación móvil de despertar forzoso mediante hardware ESP32 en red local (HTTP + mDNS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Gestión de Estado y Utilidades
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0

  # Audio de Alta Prioridad y Alarma
  audioplayers: ^6.1.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  wakelock_plus: ^1.2.8

  # Servidor HTTP Local y Red
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^6.0.1

  # Descubrimiento y Resolución mDNS (esp32-alarma.local)
  multicast_dns: ^0.3.2+7
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
