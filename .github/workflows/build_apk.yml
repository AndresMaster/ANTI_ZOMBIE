name: Build Android APK and GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Rename APK for Release
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/Alarma_ESP32_Antizombi.apk
          if [ -f "Alarma_ESP32_Antizombi.ipa" ]; then
            cp Alarma_ESP32_Antizombi.ipa release_assets/
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🚀 Alarma ESP32 Antizombi - Versión ${{ github.ref_name }}

            ### 📦 Paquetes de Instalación:
            - **Android:** Descarga `Alarma_ESP32_Antizombi.apk` e instálalo directamente en cualquier celular Android.
            - **iPhone (Apple):** Descarga `Alarma_ESP32_Antizombi.ipa` e instálalo mediante **AltStore** o **Sideloadly**.

            ### ✨ Novedades:
            - Servidor HTTP local embebido (Puerto 8080).
            - Difusión UDP Broadcast a `255.255.255.255` (Zero-Configuration, sin depender de IPs fijas).
            - Radar mDNS (`esp32-alarma.local`).
            - Sirena de alarma física bitonal empaquetada.
            - Modo Oscuro de ultra bajo brillo ("Cero Deslumbramientos").
            - Firmware ESP32 listo para flashear en `esp32_firmware/`.
          files: |
            release_assets/Alarma_ESP32_Antizombi.apk
            release_assets/Alarma_ESP32_Antizombi.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
